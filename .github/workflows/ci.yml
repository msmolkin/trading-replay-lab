name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - name: Scan tracked files and run policy self-test
        run: python .github/workflows/scripts/repo_policy.py --root . --self-test

  web:
    name: Web / contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'apps/web/package.json', 'packages/contracts/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Formatter rejection self-test
        shell: bash
        run: |
          mkdir -p .tmp-format-selftest
          printf 'const badlyFormatted={answer:42}\n' > .tmp-format-selftest/bad.ts
          if pnpm exec biome format .tmp-format-selftest/bad.ts >/dev/null 2>&1; then
            echo "Biome unexpectedly accepted malformed formatting"
            exit 1
          fi
          rm -rf .tmp-format-selftest

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements-bootstrap.txt
            apps/api/pyproject.toml
            workers/ingest/pyproject.toml
      - name: Install
        run: python -m pip install -r requirements-bootstrap.txt -e apps/api -e workers/ingest
      - run: ruff format --check apps/api workers/ingest
      - run: ruff check apps/api workers/ingest
      - run: mypy --strict apps/api/src workers/ingest/src apps/api/tests workers/ingest/tests
      - run: pytest -q apps/api/tests workers/ingest/tests

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.98.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check --workspace --all-targets --locked
      - run: cargo test --workspace --all-targets --locked

  contracts:
    name: Generated contracts / compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.7"
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Generated-code drift
        run: |
          if [[ -f packages/contracts/scripts/generate.py ]]; then
            python packages/contracts/scripts/generate.py --check
          else
            echo "M0-02 generator not merged yet; drift check will activate automatically."
          fi
      - name: Schema compatibility
        run: |
          if [[ -f packages/contracts/scripts/check_compat.py ]]; then
            python packages/contracts/scripts/check_compat.py
          else
            echo "M0-02 compatibility checker not merged yet; check will activate automatically."
          fi
      - name: Cross-language round trips
        run: |
          if [[ -f packages/contracts/scripts/roundtrip.py ]]; then
            python packages/contracts/scripts/roundtrip.py
          else
            echo "M0-02 round-trip harness not merged yet; check will activate automatically."
          fi
